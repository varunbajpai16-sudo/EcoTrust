<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img">
  <defs>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#064E3B"/>
      <stop offset=".55" stop-color="#0B6B50"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>

    <linearGradient id="mint" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0B6B50"/>
      <stop offset=".65" stop-color="#34D399"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>

    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B6B50"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>

    <filter id="shadow">
      <feDropShadow
        dx="0"
        dy="10"
        stdDeviation="14"
        flood-opacity=".12"
      />
    </filter>
  </defs>

  <!-- ECO TRUST ICON -->
  <g transform="translate(600 315)" filter="url(#shadow)">

    <!-- Large Leaf -->
    <path
      d="M-210 75C-250-90-120-230 165-245
         C95-165 25-55-75 25
         C-120 61-165 78-210 75Z"
      fill="url(#leaf)"
    />

    <!-- Inner Leaf -->
    <path
      d="M-150 88C-105 15-20-7 86-57
         C35 18-35 75-116 120
         C-137 109-148 99-150 88Z"
      fill="#34D399"
    />

    <!-- Lower Leaf -->
    <path
      d="M-126 118C-50 92 16 76 83 35
         C48 99-18 143-100 160
         C-113 150-122 136-126 118Z"
      fill="#A3E635"
    />

    <!-- Bottom Leaf Sweep -->
    <path
      d="M-165 130C-62 176 60 181 176 113
         C151 191 72 237-31 238
         C-92 238-140 201-165 130Z"
      fill="url(#mint)"
    />

    <!-- Factory -->
    <g fill="#064E3B">
      <path d="M34 76V-10L88 24V-7L139 25V76Z"/>

      <rect
        x="88"
        y="-92"
        width="17"
        height="86"
        rx="3"
      />

      <rect
        x="126"
        y="-62"
        width="15"
        height="56"
        rx="3"
      />
    </g>

    <!-- Green Emissions -->
    <g fill="#34D399">

      <path
        d="M94-105C64-126 74-158 107-166
           C119-140 113-119 94-105Z"
      />

      <path
        d="M135-78C111-101 123-128 153-132
           C160-106 154-89 135-78Z"
      />

      <path
        d="M118-151C101-171 112-191 137-194
           C142-174 136-160 118-151Z"
      />

    </g>

    <!-- Analytics Monitor -->
    <g transform="translate(44 33)">

      <!-- Monitor -->
      <rect
        width="142"
        height="96"
        rx="12"
        fill="#064E3B"
      />

      <!-- Screen -->
      <rect
        x="10"
        y="10"
        width="122"
        height="67"
        rx="6"
        fill="#F7FAF8"
      />

      <!-- Line Chart -->
      <path
        d="M18 63L42 50L63 55L83 36L105 42L125 25"
        fill="none"
        stroke="#0B6B50"
        stroke-width="5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Bar Chart -->
      <g fill="#34D399">
        <rect x="21" y="55" width="10" height="8" rx="2"/>
        <rect x="45" y="48" width="10" height="15" rx="2"/>
        <rect x="69" y="42" width="10" height="21" rx="2"/>
        <rect x="93" y="32" width="10" height="31" rx="2"/>
        <rect x="117" y="22" width="10" height="41" rx="2"/>
      </g>

      <!-- Chart Point -->
      <circle
        cx="83"
        cy="36"
        r="5"
        fill="#A3E635"
      />

      <!-- Monitor Stand -->
      <rect
        x="58"
        y="96"
        width="26"
        height="8"
        rx="4"
        fill="#064E3B"
      />

      <rect
        x="45"
        y="104"
        width="52"
        height="7"
        rx="3.5"
        fill="#064E3B"
      />

    </g>
  </g>

  <!-- ECOTRUST WORDMARK -->
  <text
    x="600"
    y="675"
    text-anchor="middle"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="132"
    font-weight="800"
    letter-spacing="-5"
    fill="url(#word)"
  >
    EcoTrust
  </text>

  <!-- Divider Lines -->
  <rect
    x="155"
    y="735"
    width="135"
    height="4"
    rx="2"
    fill="#A3E635"
  />

  <rect
    x="910"
    y="735"
    width="135"
    height="4"
    rx="2"
    fill="#A3E635"
  />

  <!-- TAGLINE -->
  <text
    x="600"
    y="750"
    text-anchor="middle"
    font-family="Inter, Arial, Helvetica, sans-serif"
    font-size="34"
    font-weight="500"
    letter-spacing="2"
    fill="#064E3B"
  >
    Clean Data • Safer Tomorrow
  </text>

</svg>